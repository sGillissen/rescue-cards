      RR: ⬇
      Haut: exsikkotisch
    D: 'Bewusstsein: ⬇'
    E: |-
      Übelkeit / Erbrechen
      starker Durst
  einteilung: 'Ursachen: Durchfall, Erbrechen, Fieber, Flüssigkeitszufuhr ⬇, Schwitzen, Verbrennung, Diabetes'
