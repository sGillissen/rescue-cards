<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a2742">
<title>Rescue Cards</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
:root {
  --navy: #1a2742;
  --navy-dark: #131c33;
  --green: #1a8a3c;
  --green-light: #d6efdd;
  --green-border: #6fbc7c;
  --ki-bg: #f5dbdb;
  --ki-border: #d99a9a;
  --ki-text: #b03030;
  --grey-bar: #d4d4dc;
  --bg: #f2f3f5;
  --text: #1f2333;
  --muted: #6b7280;
  --card-bg: #ffffff;
  --border: #e3e5ea;
  --aml1: #0288d1;
  --aml2: #c0392b;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
  font-size: 15px;
  line-height: 1.45;
}

/* ===== Header ===== */
header {
  background: var(--navy);
  color: white;
  padding: 10px 14px 8px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.header-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
h1.brand {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: .2px;
  flex: 0 0 auto;
}
.version {
  font-size: 0.7rem;
  color: #95a3bd;
  font-weight: 400;
}
.aml-toggle {
  display: flex;
  margin-left: auto;
  background: var(--navy-dark);
  border-radius: 8px;
  padding: 3px;
}
.aml-toggle button {
  background: none;
  border: none;
  color: #95a3bd;
  font-size: .8rem;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all .15s;
}
.aml-toggle button.active[data-aml="1"] { background: var(--aml1); color: white; }
.aml-toggle button.active[data-aml="2"] { background: var(--aml2); color: white; }
.aml-toggle button.active[data-aml="all"] { background: #455a7e; color: white; }

.search-wrap {
  position: relative;
}
.search-wrap input {
  width: 100%;
  padding: 9px 12px 9px 36px;
  border-radius: 8px;
  border: none;
  background: var(--navy-dark);
  color: white;
  font-size: 16px; /* iOS no-zoom */
  outline: none;
}
.search-wrap input::placeholder { color: #6e7e9a; }
.search-wrap .search-icon {
  position: absolute;
  left: 11px; top: 50%;
  transform: translateY(-50%);
  color: #6e7e9a;
  pointer-events: none;
}

/* ===== Filter chips ===== */
.filter-row {
  background: var(--navy);
  padding: 0 10px 10px;
  position: sticky;
  top: 91px;
  z-index: 99;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.filter-container {
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  gap: 6px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-container::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0;
  background: var(--navy-dark);
  color: #b0bccf;
  padding: 5px 12px;
  border-radius: 14px;
  font-size: .75rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid #2b3a5c;
  user-select: none;
  white-space: nowrap;
}
.filter-chip.active {
  background: #29b6f6;
  color: #0a1828;
  border-color: #29b6f6;
}
.filter-reset {
  background: #c62828;
  color: white;
  border-color: #c62828;
  display: none;
}
.filter-reset.visible { display: inline-flex; }

/* ===== Main / List ===== */
main {
  max-width: 800px;
  margin: 0 auto;
  padding: 12px 10px 40px;
}
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}

/* ===== Card ===== */
.card {
  background: var(--card-bg);
  border-radius: 8px;
  margin-bottom: 5px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
  border: 1px solid var(--border);
  overflow: hidden;
}
.card-header {
  padding: 7px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  min-height: 36px;
}
.card-header .title {
  flex: 1;
  font-weight: 600;
  font-size: .88rem;
  color: var(--text);
  line-height: 1.25;
}
.card-header .chevron svg { width: 16px; height: 16px; display: block; }
.aml-badge {
  font-size: .65rem;
  font-weight: 700;
  padding: 3px 7px;
  border-radius: 4px;
  color: white;
  letter-spacing: .3px;
}
.aml-badge.aml1 { background: var(--aml1); }
.aml-badge.aml2 { background: var(--aml2); }
.chevron {
  color: var(--muted);
  transition: transform .2s;
}
.card.open .chevron { transform: rotate(180deg); }

.card-body {
  display: none;
  padding: 4px 10px 14px;
  position: relative;
}
.card.open .card-body { display: block; }

/* Monitoring strip on right */
.monitoring-strip {
  position: absolute;
  right: 0; top: 4px; bottom: 14px;
  width: 24px;
  background: var(--grey-bar);
  display: flex;
  align-items: center;
  justify-content: center;
}
.monitoring-strip span {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  color: var(--navy);
  font-weight: 600;
  font-size: .7rem;
  letter-spacing: 2px;
}

/* ===== Block (ABCDE / Diagnose / Keypoints / Reevaluation) ===== */
.block {
  display: flex;
  margin-bottom: 8px;
  border-radius: 10px;
  overflow: hidden;
  background: white;
  border: 1px solid var(--border);
}
.block-icon {
  background: var(--navy);
  color: white;
  width: 56px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.block-icon svg { width: 28px; height: 28px; }
.block-body {
  padding: 8px 12px;
  flex: 1;
  font-size: .85rem;
}
.block-label {
  text-align: right;
  font-weight: 700;
  color: var(--navy);
  font-size: .8rem;
  margin-bottom: 4px;
}

/* ABCDE list */
.abcde {
  display: grid;
  grid-template-columns: 18px 1fr;
  gap: 2px 8px;
  font-size: .83rem;
}
.abcde dt { font-weight: 700; color: var(--navy); }
.abcde dd { margin: 0; }

/* Diagnose */
.diagnose-list { margin: 0; padding: 0; list-style: none; }
.diagnose-list li { padding: 1px 0; }
.diagnose-icon-inline {
  float: right;
  width: 36px; height: 36px;
  background: var(--ki-text);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  margin-left: 6px;
}
.diagnose-icon-inline svg { width: 22px; height: 22px; }

/* Keypoints */
.keypoints { list-style: none; padding: 0; margin: 0; }
.keypoints li {
  padding: 2px 0;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.keypoints li::before {
  content: '';
  width: 12px; height: 12px;
  border: 1.5px solid var(--navy);
  border-radius: 2px;
  flex-shrink: 0;
  margin-top: 4px;
}

/* ===== Venenzugang separator ===== */
.venenzugang {
  display: flex;
  align-items: center;
  margin: 6px 0;
  border-radius: 10px;
  overflow: hidden;
  background: white;
  border: 1px solid var(--border);
}
.venenzugang .block-icon { background: var(--navy); }
.venenzugang .v-label {
  font-weight: 700;
  color: var(--navy);
  padding: 10px 14px;
  font-size: .92rem;
}

/* ===== Medikament-Box ===== */
.med {
  display: flex;
  margin: 6px 0;
  border-radius: 10px;
  overflow: hidden;
  background: white;
  border: 1px solid var(--green-border);
}
.med-icon {
  background: var(--green);
  color: white;
  width: 56px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.med-icon svg { width: 30px; height: 30px; }
.med-body {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.med-main {
  padding: 8px 12px;
  border-bottom: 1px solid var(--green-border);
}
.med-name {
  font-weight: 700;
  color: var(--navy);
  font-size: .92rem;
  margin-bottom: 4px;
}
.med-name .route {
  font-weight: 600;
  font-size: .82rem;
  color: var(--text);
}
.med-name .note {
  font-weight: 400;
  font-size: .78rem;
  color: var(--muted);
  font-style: italic;
}
.dose-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 10px;
  font-size: .82rem;
  padding: 1px 0;
}
.dose-row .label { color: var(--text); }
.dose-row .value { font-weight: 600; color: var(--navy); }
.med-nw {
  padding: 5px 12px;
  font-size: .78rem;
  background: #f7fbf6;
}
.med-nw .lbl { color: var(--ki-text); font-weight: 700; }
.med-ki {
  background: var(--ki-bg);
  border-left: 1px solid var(--ki-border);
  padding: 8px 10px;
  width: 90px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: .72rem;
  text-align: center;
  color: var(--ki-text);
}
.med-ki .ki-label {
  font-weight: 700;
  margin-bottom: 3px;
  align-self: flex-start;
}
.med-ki svg { width: 18px; height: 18px; align-self: flex-end; }
.med-row {
  display: flex;
}
.med-row .med-main { flex: 1; border-bottom: none; }

/* ===== Reevaluation ===== */
.reeval {
  margin: 6px 0;
  border-radius: 10px;
  overflow: hidden;
  background: white;
  border: 1px solid var(--border);
  position: relative;
}
.reeval-head {
  display: flex;
  align-items: stretch;
}
.reeval-icon {
  background: var(--navy);
  color: white;
  width: 56px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.reeval-icon svg { width: 30px; height: 30px; }
.reeval-body {
  padding: 8px 12px;
  flex: 1;
  font-size: .83rem;
}
.reeval-heading {
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 4px;
}
.reeval-doses {
  list-style: none;
  padding: 0;
  margin: 4px 0 0;
}
.reeval-doses li {
  padding: 1px 0;
  font-weight: 600;
}

/* ===== Tablet & up ===== */
@media (min-width: 600px) {
  body { font-size: 15px; }
  .block-icon, .med-icon, .reeval-icon { width: 70px; }
  .block-icon svg { width: 34px; height: 34px; }
  .med-icon svg, .reeval-icon svg { width: 36px; height: 36px; }
  .med-ki { width: 110px; }
}

/* ===== Bilder-Section (Platzhalter für später) ===== */
.bilder-section {
  margin: 8px 0 6px 0;
  padding: 8px 12px;
  background: #fffbe6;
  border: 1px dashed #e0c860;
  border-radius: 8px;
  font-size: .8rem;
  color: #8a6d1f;
}

/* ===== und/oder Separator ===== */
.und-oder {
  margin: 4px 0;
  text-align: center;
  position: relative;
  font-size: .78rem;
  font-weight: 600;
  color: var(--green);
}
.und-oder span {
  background: var(--bg);
  padding: 0 10px;
  position: relative;
  z-index: 1;
}
.und-oder::before {
  content: '';
  position: absolute;
  left: 56px; right: 0; top: 50%;
  height: 1px;
  background: var(--green-border);
}

/* ===== Definition (Fließtext-Block) ===== */
.definition-text {
  font-size: .87rem;
  color: var(--text);
  padding: 2px 0;
}

/* ABCDE: mehrere Zeilen pro Letter */
.abcde dd > div {
  padding: 1px 0;
}

/* ===== Bilder ===== */
.karten-bilder {
  margin: 8px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.karten-bilder img {
  max-width: 100%;
  max-height: 280px;
  border-radius: 8px;
  border: 1px solid var(--border);
  cursor: zoom-in;
}

/* ===== Collapsible-Blöcke (Maßnahmen / Einteilung / DD) ===== */
.collapse-block {
  margin: 4px 0;
  background: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.collapse-block summary {
  padding: 8px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  list-style: none;
  font-size: .82rem;
  user-select: none;
}
.collapse-block summary::-webkit-details-marker { display: none; }
.collapse-label {
  flex: 1;
  font-weight: 600;
  color: var(--navy);
}
.collapse-icon {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--navy);
  width: 22px; height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #e0e7f1;
  border-radius: 50%;
  transition: transform .15s;
}
.collapse-block[open] .collapse-icon { transform: rotate(45deg); }
.collapse-body {
  padding: 4px 14px 12px;
  font-size: .85rem;
  color: var(--text);
}
.massnahmen-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.massnahmen-list li {
  background: #e0e7f1;
  padding: 4px 10px;
  border-radius: 14px;
  font-weight: 600;
  color: var(--navy);
  font-size: .78rem;
}
.block-text {
  font-size: .85rem;
  color: var(--text);
  line-height: 1.5;
}

/* ===== Reeval Notes ===== */
.reeval-note {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 6px;
  font-size: .82rem;
}
.reeval-note-icon {
  width: 18px; height: 18px;
  color: var(--green);
  flex-shrink: 0;
  margin-top: 2px;
}
</style>
</head>

<script>
// ===== Daten =====
const CATEGORIES = [
  { id: 'allergie', label: 'Allergie' },
  { id: 'resp', label: 'Respiratorisch' },
  { id: 'cardio', label: 'Kardiovaskulär' },
  { id: 'neuro', label: 'Neurologisch' },
  { id: 'meta', label: 'Metabolisch' },
  { id: 'schmerz', label: 'Schmerz' },
  { id: 'trauma', label: 'Trauma' },
  { id: 'reanimation', label: 'Reanimation' },
  { id: 'sonstiges', label: 'Sonstiges' },
];

let ALGORITHMS = [];  // → wird beim Start aus algorithms.yaml geladen

// ===== State =====
const state = {
  search: '',
  filters: new Set(),
  open: new Set(),
};

// ===== Renderer =====
const $ = s => document.querySelector(s);
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function iconSvg(name, cls = '') {
  return `<svg class="${cls}"><use href="#i-${name}"/></svg>`;
}

function renderFilters() {
  const c = $('#filterContainer');
  c.innerHTML = CATEGORIES.map(cat =>
    `<button class="filter-chip ${state.filters.has(cat.id) ? 'active' : ''}" data-cat="${cat.id}">${cat.label}</button>`
  ).join('') + `<button class="filter-chip filter-reset ${state.filters.size ? 'visible' : ''}" id="filterReset">✕ Reset</button>`;
}

function matchesFilter(algo) {
  if (state.filters.size) {
    const has = [...state.filters].some(f => algo.categories.includes(f));
    if (!has) return false;
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    const hay = (algo.title + ' ' + (algo.medikamente||[]).map(m => m.name||'').join(' ')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function renderAbcde(abcde) {
  const items = Object.entries(abcde).map(([k, v]) => {
    const txt = String(v || '').trim();
    if (!txt) return `<dt>${k}</dt><dd></dd>`;
    const lines = txt.split('\n').map(l => escapeHtml(l.trim())).filter(Boolean);
    const body = lines.length > 1
      ? lines.map(l => `<div>${l}</div>`).join('')
      : lines[0];
    return `<dt>${k}</dt><dd>${body}</dd>`;
  });
  return `<dl class="abcde">${items.join('')}</dl>`;
}

function renderBlock(iconName, label, contentHtml, opts = {}) {
  return `
    <div class="block">
      <div class="block-icon">${iconSvg(iconName)}</div>
      <div class="block-body">
        ${label ? `<div class="block-label">${label}${opts.iconRight ? `<span class="diagnose-icon-inline">${iconSvg(opts.iconRight)}</span>` : ''}</div>` : ''}
        ${contentHtml}
      </div>
    </div>`;
}

function renderMedikament(m) {
  if (m.type === 'venenzugang') {
    return `<div class="venenzugang">
      <div class="block-icon">${iconSvg('pin')}</div>
      <div class="v-label">Venenzugang (i.v.)</div>
    </div>`;
  }
  if (m.type === 'und-oder') {
    return `<div class="und-oder"><span>und / oder</span></div>`;
  }
  const doses = (m.dosierung || []).map(d =>
    `<div class="dose-row"><span class="label">${escapeHtml(d.label)}:</span><span class="value">${escapeHtml(d.value)}</span></div>`
  ).join('');
  const ki = m.ki ? `<div class="med-ki">
    <div class="ki-label">KI:</div>
    <div class="ki-text">${escapeHtml(m.ki)}</div>
    ${iconSvg('warn')}
  </div>` : '';
  return `<div class="med">
    <div class="med-icon">${iconSvg(m.icon || 'syringe')}</div>
    <div class="med-body">
      <div class="med-row">
        <div class="med-main">
          <div class="med-name">${escapeHtml(m.name)} <span class="route">${escapeHtml(m.route||'')}</span> ${m.note ? `<span class="note">${escapeHtml(m.note)}</span>` : ''}</div>
          ${doses}
        </div>
        ${ki}
      </div>
      ${m.nw ? `<div class="med-nw"><span class="lbl">NW:</span> ${escapeHtml(m.nw)}</div>` : ''}
    </div>
  </div>`;
}

function renderReeval(r) {
  if (!r) return '';
  const notes = r.notes ? r.notes.map(n =>
    `<div class="reeval-note">${iconSvg(n.icon || 'syringe', 'reeval-note-icon')}<div>${n.strong ? `<b>${escapeHtml(n.strong)}</b> ` : ''}${escapeHtml(n.text)}</div></div>`
  ).join('') : '';
  return `<div class="reeval">
    <div class="reeval-head">
      <div class="reeval-icon">${iconSvg('clock')}</div>
      <div class="reeval-body">
        <div class="reeval-heading">Reevaluation (ABCDE)</div>
        ${r.heading ? `<div style="font-weight:600;color:var(--navy);margin-top:4px;">${escapeHtml(r.heading)}</div>` : ''}
        ${r.text ? `<div style="margin-top:4px;">${escapeHtml(r.text)}</div>` : ''}
        ${r.doses ? `<ul class="reeval-doses">${r.doses.map(d => `<li>${escapeHtml(d)}</li>`).join('')}</ul>` : ''}
        ${notes}
      </div>
    </div>
  </div>`;
}

function renderCollapsible(label, contentHtml) {
  return `<details class="collapse-block">
    <summary><span class="collapse-label">${escapeHtml(label)}</span><span class="collapse-icon">+</span></summary>
    <div class="collapse-body">${contentHtml}</div>
  </details>`;
}

function renderCardBody(algo) {
  const parts = [];

  // Definition oben
  if (algo.definition) {
    parts.push(renderBlock('info', '', `<div class="definition-text">${escapeHtml(algo.definition)}</div>`));
  }

  // ABCDE
  if (algo.abcde && Object.keys(algo.abcde).length) {
    parts.push(renderBlock('stethoscope', '', renderAbcde(algo.abcde)));
  }

  // Diagnose
  if (algo.diagnose && algo.diagnose.length) {
    parts.push(renderBlock('question', '',
      `<ul class="diagnose-list">${algo.diagnose.map(d => `<li>${escapeHtml(d)}</li>`).join('')}</ul>`
    ));
  }

  // Keypoints
  if (algo.keypoints && algo.keypoints.length) {
    parts.push(renderBlock('checklist', '',
      `<ul class="keypoints">${algo.keypoints.map(k => `<li>${escapeHtml(k)}</li>`).join('')}</ul>`
    ));
  }

  // Medikamente
  const meds = (algo.medikamente || []).map(renderMedikament).join('');
  if (meds) parts.push(meds);

  // Reevaluation
  const reev = renderReeval(algo.reevaluation);
  if (reev) parts.push(reev);

  // Bilder
  if (algo.bilder && algo.bilder.length) {
    const imgs = algo.bilder.map(b => `<img src="bilder/${encodeURIComponent(b)}" alt="" loading="lazy">`).join('');
    parts.push(`<div class="karten-bilder">${imgs}</div>`);
  }

  // Maßnahmen / Einteilung / DD als normale Blöcke (eigene Icons)
  if (algo.massnahmen && algo.massnahmen.length) {
    parts.push(renderBlock('cross', '',
      `<ul class="massnahmen-list">${algo.massnahmen.map(m => `<li>${escapeHtml(m)}</li>`).join('')}</ul>`
    ));
  }
  if (algo.einteilung) {
    parts.push(renderBlock('layers', '', `<div class="block-text">${escapeHtml(algo.einteilung)}</div>`));
  }
  if (algo.dd) {
    parts.push(renderBlock('scale', '', `<div class="block-text">${escapeHtml(algo.dd)}</div>`));
  }

  return `<div class="card-body">
    ${parts.join('')}
  </div>`;
}

function renderCard(algo) {
  const open = state.open.has(algo.id);
  return `<div class="card ${open ? 'open' : ''}" data-id="${algo.id}">
    <div class="card-header">
      <div class="title">${escapeHtml(algo.title)}</div>
      <span class="chevron">${iconSvg('chevron')}</span>
    </div>
    ${renderCardBody(algo)}
  </div>`;
}

function renderList() {
  const filtered = ALGORITHMS.filter(matchesFilter);
  $('#cardList').innerHTML = filtered.map(renderCard).join('');
  $('#emptyState').style.display = filtered.length ? 'none' : 'block';
}

function render() {
  renderFilters();
  renderList();
}

// ===== Events =====
document.addEventListener('click', e => {
  // Filter chip
  const chip = e.target.closest('.filter-chip[data-cat]');
  if (chip) {
    const cat = chip.dataset.cat;
    if (state.filters.has(cat)) state.filters.delete(cat);
    else state.filters.add(cat);
    render();
    return;
  }
  // Filter reset
  if (e.target.closest('#filterReset')) {
    state.filters.clear();
    render();
    return;
  }
  // Card toggle (Akkordeon: nur eine Karte offen)
  const cardHeader = e.target.closest('.card-header');
  if (cardHeader) {
    const card = cardHeader.parentElement;
    const id = card.dataset.id;
    const wasOpen = state.open.has(id);
    document.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));
    state.open.clear();
    if (!wasOpen) {
      state.open.add(id);
      card.classList.add('open');
      // smooth scroll header to top so user sees content
      setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
    }
    return;
  }
});

$('#search').addEventListener('input', e => {
  state.search = e.target.value.trim();
  renderList();
});

// Initial: Daten aus algorithms.yaml laden
async function init() {
  try {
    const res = await fetch('algorithms.yaml');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    ALGORITHMS = jsyaml.load(text) || [];
    render();
  } catch (err) {
    document.getElementById('cardList').innerHTML =
      `<div class="empty-state">Daten konnten nicht geladen werden:<br><code>${err.message}</code></div>`;
    console.error(err);
  }
}
init();
</script>
</body>
</html>
