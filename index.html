<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a2742">
<title>Rescue Cards</title>
<style>
:root {
  --navy: #1a2742;
  --navy-dark: #131c33;
  --green: #1a8a3c;
  --green-light: #d6efdd;
  --green-border: #6fbc7c;
  --ki-bg: #f5dbdb;
  --ki-border: #d99a9a;
  --ki-text: #b03030;
  --grey-bar: #d4d4dc;
  --bg: #f2f3f5;
  --text: #1f2333;
  --muted: #6b7280;
  --card-bg: #ffffff;
  --border: #e3e5ea;
  --aml1: #0288d1;
  --aml2: #c0392b;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
  font-size: 15px;
  line-height: 1.45;
}

/* ===== Header ===== */
header {
  background: var(--navy);
  color: white;
  padding: 10px 14px 8px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.header-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
h1.brand {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: .2px;
  flex: 0 0 auto;
}
.version {
  font-size: 0.7rem;
  color: #95a3bd;
  font-weight: 400;
}
.aml-toggle {
  display: flex;
  margin-left: auto;
  background: var(--navy-dark);
  border-radius: 8px;
  padding: 3px;
}
.aml-toggle button {
  background: none;
  border: none;
  color: #95a3bd;
  font-size: .8rem;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all .15s;
}
.aml-toggle button.active[data-aml="1"] { background: var(--aml1); color: white; }
.aml-toggle button.active[data-aml="2"] { background: var(--aml2); color: white; }
.aml-toggle button.active[data-aml="all"] { background: #455a7e; color: white; }

.search-wrap {
  position: relative;
}
.search-wrap input {
  width: 100%;
  padding: 9px 12px 9px 36px;
  border-radius: 8px;
  border: none;
  background: var(--navy-dark);
  color: white;
  font-size: 16px; /* iOS no-zoom */
  outline: none;
}
.search-wrap input::placeholder { color: #6e7e9a; }
.search-wrap .search-icon {
  position: absolute;
  left: 11px; top: 50%;
  transform: translateY(-50%);
  color: #6e7e9a;
  pointer-events: none;
}

/* ===== Filter chips ===== */
.filter-row {
  background: var(--navy);
  padding: 0 10px 10px;
  position: sticky;
  top: 91px;
  z-index: 99;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.filter-container {
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  gap: 6px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-container::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0;
  background: var(--navy-dark);
  color: #b0bccf;
  padding: 5px 12px;
  border-radius: 14px;
  font-size: .75rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid #2b3a5c;
  user-select: none;
  white-space: nowrap;
}
.filter-chip.active {
  background: #29b6f6;
  color: #0a1828;
  border-color: #29b6f6;
}
.filter-reset {
  background: #c62828;
  color: white;
  border-color: #c62828;
  display: none;
}
.filter-reset.visible { display: inline-flex; }

/* ===== Main / List ===== */
main {
  max-width: 800px;
  margin: 0 auto;
  padding: 12px 10px 40px;
}
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}

/* ===== Card ===== */
.card {
  background: var(--card-bg);
  border-radius: 12px;
  margin-bottom: 10px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  border: 1px solid var(--border);
  overflow: hidden;
}
.card-header {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.card-header .title {
  flex: 1;
  font-weight: 600;
  font-size: .98rem;
  color: var(--text);
}
.aml-badge {
  font-size: .65rem;
  font-weight: 700;
  padding: 3px 7px;
  border-radius: 4px;
  color: white;
  letter-spacing: .3px;
}
.aml-badge.aml1 { background: var(--aml1); }
.aml-badge.aml2 { background: var(--aml2); }
.chevron {
  color: var(--muted);
  transition: transform .2s;
}
.card.open .chevron { transform: rotate(180deg); }

.card-body {
  display: none;
  padding: 4px 10px 14px;
  background: linear-gradient(to right, transparent 0, transparent calc(100% - 24px), var(--grey-bar) calc(100% - 24px), var(--grey-bar) 100%);
  position: relative;
}
.card.open .card-body { display: block; }

/* Monitoring strip on right */
.monitoring-strip {
  position: absolute;
  right: 0; top: 4px; bottom: 14px;
  width: 24px;
  background: var(--grey-bar);
  display: flex;
  align-items: center;
  justify-content: center;
}
.monitoring-strip span {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  color: var(--navy);
  font-weight: 600;
  font-size: .7rem;
  letter-spacing: 2px;
}

/* ===== Block (ABCDE / Diagnose / Keypoints / Reevaluation) ===== */
.block {
  display: flex;
  margin-bottom: 8px;
  margin-right: 28px;
  border-radius: 10px;
  overflow: hidden;
  background: white;
  border: 1px solid var(--border);
}
.block-icon {
  background: var(--navy);
  color: white;
  width: 56px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.block-icon svg { width: 28px; height: 28px; }
.block-body {
  padding: 8px 12px;
  flex: 1;
  font-size: .85rem;
}
.block-label {
  text-align: right;
  font-weight: 700;
  color: var(--navy);
  font-size: .8rem;
  margin-bottom: 4px;
}

/* ABCDE list */
.abcde {
  display: grid;
  grid-template-columns: 18px 1fr;
  gap: 2px 8px;
  font-size: .83rem;
}
.abcde dt { font-weight: 700; color: var(--navy); }
.abcde dd { margin: 0; }

/* Diagnose */
.diagnose-list { margin: 0; padding: 0; list-style: none; }
.diagnose-list li { padding: 1px 0; }
.diagnose-icon-inline {
  float: right;
  width: 36px; height: 36px;
  background: var(--ki-text);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  margin-left: 6px;
}
.diagnose-icon-inline svg { width: 22px; height: 22px; }

/* Keypoints */
.keypoints { list-style: none; padding: 0; margin: 0; }
.keypoints li {
  padding: 2px 0;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.keypoints li::before {
  content: '';
  width: 12px; height: 12px;
  border: 1.5px solid var(--navy);
  border-radius: 2px;
  flex-shrink: 0;
  margin-top: 4px;
}

/* ===== Venenzugang separator ===== */
.venenzugang {
  display: flex;
  align-items: center;
  margin: 6px 28px 6px 0;
  border-radius: 10px;
  overflow: hidden;
  background: white;
  border: 1px solid var(--border);
}
.venenzugang .block-icon { background: var(--navy); }
.venenzugang .v-label {
  font-weight: 700;
  color: var(--navy);
  padding: 10px 14px;
  font-size: .92rem;
}

/* ===== Medikament-Box ===== */
.med {
  display: flex;
  margin: 6px 28px 6px 0;
  border-radius: 10px;
  overflow: hidden;
  background: white;
  border: 1px solid var(--green-border);
}
.med-icon {
  background: var(--green);
  color: white;
  width: 56px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.med-icon svg { width: 30px; height: 30px; }
.med-body {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.med-main {
  padding: 8px 12px;
  border-bottom: 1px solid var(--green-border);
}
.med-name {
  font-weight: 700;
  color: var(--navy);
  font-size: .92rem;
  margin-bottom: 4px;
}
.med-name .route {
  font-weight: 600;
  font-size: .82rem;
  color: var(--text);
}
.med-name .note {
  font-weight: 400;
  font-size: .78rem;
  color: var(--muted);
  font-style: italic;
}
.dose-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 10px;
  font-size: .82rem;
  padding: 1px 0;
}
.dose-row .label { color: var(--text); }
.dose-row .value { font-weight: 600; color: var(--navy); }
.med-nw {
  padding: 5px 12px;
  font-size: .78rem;
  background: #f7fbf6;
}
.med-nw .lbl { color: var(--ki-text); font-weight: 700; }
.med-ki {
  background: var(--ki-bg);
  border-left: 1px solid var(--ki-border);
  padding: 8px 10px;
  width: 90px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: .72rem;
  text-align: center;
  color: var(--ki-text);
}
.med-ki .ki-label {
  font-weight: 700;
  margin-bottom: 3px;
  align-self: flex-start;
}
.med-ki svg { width: 18px; height: 18px; align-self: flex-end; }
.med-row {
  display: flex;
}
.med-row .med-main { flex: 1; border-bottom: none; }

/* ===== Reevaluation ===== */
.reeval {
  margin: 6px 28px 6px 0;
  border-radius: 10px;
  overflow: hidden;
  background: white;
  border: 1px solid var(--border);
  position: relative;
}
.reeval-head {
  display: flex;
  align-items: stretch;
}
.reeval-icon {
  background: var(--navy);
  color: white;
  width: 56px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.reeval-icon svg { width: 30px; height: 30px; }
.reeval-body {
  padding: 8px 12px;
  flex: 1;
  font-size: .83rem;
}
.reeval-heading {
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 4px;
}
.reeval-doses {
  list-style: none;
  padding: 0;
  margin: 4px 0 0;
}
.reeval-doses li {
  padding: 1px 0;
  font-weight: 600;
}

/* ===== Tablet & up ===== */
@media (min-width: 600px) {
  body { font-size: 15px; }
  .block-icon, .med-icon, .reeval-icon { width: 70px; }
  .block-icon svg { width: 34px; height: 34px; }
  .med-icon svg, .reeval-icon svg { width: 36px; height: 36px; }
  .med-ki { width: 110px; }
}

/* ===== Bilder-Section (Platzhalter für später) ===== */
.bilder-section {
  margin: 8px 28px 6px 0;
  padding: 8px 12px;
  background: #fffbe6;
  border: 1px dashed #e0c860;
  border-radius: 8px;
  font-size: .8rem;
  color: #8a6d1f;
}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1 class="brand">Rescue Cards <span class="version">V8</span></h1>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="Suche nach Notfall, Medikament...">
  </div>
</header>

<div class="filter-row">
  <div class="filter-container" id="filterContainer"></div>
</div>

<main>
  <div id="cardList"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    Keine Algorithmen gefunden.
  </div>
</main>

<!-- SVG Icon Definitions -->
<svg style="display:none">
  <defs>
    <symbol id="i-lungs" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 3v8m0 0c-1 0-2-.8-2-2V5a2 2 0 1 1 4 0v4c0 1.2-1 2-2 2zm-7 1c-1 1-2 3-2 6 0 4 2 7 4 7s2-2 2-4V8c0-1-1-2-2-2-1 0-1.5.5-2 1zm14 0c1 1 2 3 2 6 0 4-2 7-4 7s-2-2-2-4V8c0-1 1-2 2-2 1 0 1.5.5 2 1z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-arrows" viewBox="0 0 24 24">
      <path d="M12 22V8m0 0l-4 4m4-4l4 4M5 12L2 9l3-3m14 6l3-3-3-3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-checklist" viewBox="0 0 24 24">
      <rect x="3" y="4" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.8" fill="none"/>
      <rect x="3" y="13" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.8" fill="none"/>
      <path d="M11 6h10M11 16h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M4.5 6.2l1 1 2-2.2M4.5 15.2l1 1 2-2.2" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24">
      <path d="M4 4l16 16M20 4L4 20M9 9l-4 4 6 6 4-4M15 15l4-4-6-6-4 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-syringe" viewBox="0 0 24 24">
      <path d="M18 2l4 4M16 4l4 4M11 9l4 4-7 7-4-4 7-7zM3 21l3-3M14 6l4 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-drop" viewBox="0 0 24 24">
      <path d="M12 2c0 0-7 8-7 13a7 7 0 0 0 14 0c0-5-7-13-7-13z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" fill="none"/>
      <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M3 8L5 6l2 2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-heart-warn" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>
    </symbol>
    <symbol id="i-warn" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2L1 21h22L12 2zm0 6l7.5 13h-15L12 8zm-1 4v4h2v-4h-2zm0 5v2h2v-2h-2z"/>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<script>
// ===== Daten =====
const CATEGORIES = [
  { id: 'allergie', label: 'Allergie' },
  { id: 'resp', label: 'Respiratorisch' },
  { id: 'cardio', label: 'Kardiovaskulär' },
  { id: 'neuro', label: 'Neurologisch' },
  { id: 'meta', label: 'Metabolisch' },
  { id: 'schmerz', label: 'Schmerz' },
  { id: 'trauma', label: 'Trauma' },
  { id: 'reanimation', label: 'Reanimation' },
];

const ALGORITHMS = [
  {
    id: 'anaphylaxie-aml2',
    title: 'Schwere anaphylaktische Reaktion',
    aml: 2,
    categories: ['allergie', 'resp', 'cardio'],
    bilder: [],
    abcde: {
      A: 'Stridor, Schwellung der Atemwege',
      B: 'Tachypnoe, SpO₂-Abfall',
      C: 'Schwitzen, Blässe, Rekap > 4 Sek, Hypotonie',
      D: 'Somnolenz, Schwindel',
      E: 'Rötung der Haut, Quaddeln'
    },
    diagnose: [
      'Ereignisbezogener Zusammenhang (Insektenstich, Medikamente, Nahrungsmittel, etc.)',
      'Schwere Atemnot, Stridor, Bronchospasmus',
      'Schocksymptome',
      'Eventuell Rötung der Haut, Quaddeln'
    ],
    keypoints: [
      'Maßnahmen nach ABCDE setzen',
      'Auslöser entfernen',
      'Reanimationsbereitschaft'
    ],
    medikamente: [
      {
        name: 'Adrenalin (Autoinjektor)', route: 'i.m.',
        icon: 'syringe',
        dosierung: [
          { label: '3.–6. vLJ', value: '0,15 mg i.m.' },
          { label: '6.–12. vLJ', value: '0,3 mg i.m.' },
          { label: 'ab 12. vLJ (beide Autoinjektoren)', value: '0,45 mg i.m.' }
        ],
        ki: '< 15 kg KG und < 3. vLJ',
        nw: 'Zittern/Unruhe, Herzfrequenzanstieg/Blutdruckanstieg'
      },
      { type: 'venenzugang' },
      {
        name: 'Isotone Elektrolytlösung', route: 'i.v.',
        icon: 'drop',
        dosierung: [
          { label: 'Erwachsene', value: '500 ml i.v.' },
          { label: 'Kinder', value: '10 ml / kg KG i.v.' }
        ],
        ki: '< 6. vLJ',
        nw: 'Keine'
      },
      {
        name: 'Diphenhydramin', route: 'i.v.', note: '(Keine Wiederholung)',
        icon: 'syringe',
        dosierung: [
          { label: 'einmalig ab 18 kg KG', value: '30 mg i.v. (1 Ampulle)' }
        ],
        ki: '< 18 kg KG',
        nw: 'Müdigkeit'
      }
    ],
    reevaluation: {
      heading: 'Keine Besserung nach 5 Minuten?',
      text: 'Einmalige Wiederholung von Adrenalin (Suprarenin ® 1:1000) i.m. in folgenden Dosierungen erlaubt:',
      doses: [
        '3. bis 6. vLJ: 0,15 mg i.m. = 0,15 ml',
        '6. bis 12. vLJ: 0,3 mg i.m. = 0,3 ml',
        '> 12. vLJ: 0,5 mg i.m. = 0,5 ml'
      ]
    }
  },
  {
    id: 'hypoglykaemie-aml2',
    title: 'Hypoglykämie',
    aml: 2,
    categories: ['meta', 'neuro'],
    bilder: [],
    abcde: {
      A: 'je nach Bewusstseinszustand frei, gefährdet, verlegt',
      B: 'Zyanose? AF? SpO₂? Auskultation: bds. belüftet?',
      C: 'Hämodynamische Differentialdiagnose?',
      D: 'Bewusstseinsstörung – neurologische Differentialdiagnose?',
      E: 'Typ I Diabetes? Insulinpumpe?'
    },
    diagnose: [
      'Bewusstseinsstörung',
      'UND',
      'Blutzucker unter 50 mg/dL'
    ],
    keypoints: [
      'Maßnahmen nach ABCDE setzen',
      'ggf. Insulinpumpe diskonnektieren'
    ],
    medikamente: [
      { type: 'venenzugang' },
      {
        name: 'Glucose 33%', route: 'i.v.',
        icon: 'syringe',
        dosierung: [
          { label: 'Erwachsene', value: '13,2 g rasch i.v. (40 ml)' },
          { label: 'Kinder', value: '6,6 g rasch i.v. (20 ml)' }
        ],
        ki: '< 6. vLJ',
        nw: 'Lokale Venenreizung'
      }
    ],
    reevaluation: {
      text: 'Mit 20 ml isotoner Elektrolytlösung i.v. nachspülen. Wiederholung der Glucose-Boli bis der Normwert erreicht ist.'
    }
  }
];

// ===== State =====
const state = {
  search: '',
  filters: new Set(),
  open: new Set(),
};

// ===== Renderer =====
const $ = s => document.querySelector(s);
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function iconSvg(name, cls = '') {
  return `<svg class="${cls}"><use href="#i-${name}"/></svg>`;
}

function renderFilters() {
  const c = $('#filterContainer');
  c.innerHTML = CATEGORIES.map(cat =>
    `<button class="filter-chip ${state.filters.has(cat.id) ? 'active' : ''}" data-cat="${cat.id}">${cat.label}</button>`
  ).join('') + `<button class="filter-chip filter-reset ${state.filters.size ? 'visible' : ''}" id="filterReset">✕ Reset</button>`;
}

function matchesFilter(algo) {
  if (state.filters.size) {
    const has = [...state.filters].some(f => algo.categories.includes(f));
    if (!has) return false;
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    const hay = (algo.title + ' ' + (algo.medikamente||[]).map(m => m.name||'').join(' ')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function renderAbcde(abcde) {
  return `<dl class="abcde">${
    Object.entries(abcde).map(([k,v]) =>
      `<dt>${k}</dt><dd>${escapeHtml(v)}</dd>`
    ).join('')
  }</dl>`;
}

function renderBlock(iconName, label, contentHtml, opts = {}) {
  return `
    <div class="block">
      <div class="block-icon">${iconSvg(iconName)}</div>
      <div class="block-body">
        ${label ? `<div class="block-label">${label}${opts.iconRight ? `<span class="diagnose-icon-inline">${iconSvg(opts.iconRight)}</span>` : ''}</div>` : ''}
        ${contentHtml}
      </div>
    </div>`;
}

function renderMedikament(m) {
  if (m.type === 'venenzugang') {
    return `<div class="venenzugang">
      <div class="block-icon">${iconSvg('pin')}</div>
      <div class="v-label">Venenzugang (i.v.)</div>
    </div>`;
  }
  const doses = (m.dosierung || []).map(d =>
    `<div class="dose-row"><span class="label">${escapeHtml(d.label)}:</span><span class="value">${escapeHtml(d.value)}</span></div>`
  ).join('');
  const ki = m.ki ? `<div class="med-ki">
    <div class="ki-label">KI:</div>
    <div class="ki-text">${escapeHtml(m.ki)}</div>
    ${iconSvg('warn')}
  </div>` : '';
  return `<div class="med">
    <div class="med-icon">${iconSvg(m.icon || 'syringe')}</div>
    <div class="med-body">
      <div class="med-row">
        <div class="med-main">
          <div class="med-name">${escapeHtml(m.name)} <span class="route">${escapeHtml(m.route||'')}</span> ${m.note ? `<span class="note">${escapeHtml(m.note)}</span>` : ''}</div>
          ${doses}
        </div>
        ${ki}
      </div>
      ${m.nw ? `<div class="med-nw"><span class="lbl">NW:</span> ${escapeHtml(m.nw)}</div>` : ''}
    </div>
  </div>`;
}

function renderReeval(r) {
  if (!r) return '';
  return `<div class="reeval">
    <div class="reeval-head">
      <div class="reeval-icon">${iconSvg('clock')}</div>
      <div class="reeval-body">
        <div class="reeval-heading">Reevaluation (ABCDE)</div>
        ${r.heading ? `<div style="font-weight:600;color:var(--navy);margin-top:4px;">${escapeHtml(r.heading)}</div>` : ''}
        ${r.text ? `<div style="margin-top:4px;">${escapeHtml(r.text)}</div>` : ''}
        ${r.doses ? `<ul class="reeval-doses">${r.doses.map(d => `<li>${escapeHtml(d)}</li>`).join('')}</ul>` : ''}
      </div>
    </div>
  </div>`;
}

function renderCardBody(algo) {
  const blocks = [];
  blocks.push(renderBlock('lungs', '', renderAbcde(algo.abcde)));
  blocks.push(renderBlock('arrows', 'Diagnose',
    `<ul class="diagnose-list">${algo.diagnose.map(d => `<li>${escapeHtml(d)}</li>`).join('')}</ul>`,
    { iconRight: 'heart-warn' }
  ));
  blocks.push(renderBlock('checklist', 'Keypoints',
    `<ul class="keypoints">${algo.keypoints.map(k => `<li>${escapeHtml(k)}</li>`).join('')}</ul>`
  ));
  const meds = (algo.medikamente || []).map(renderMedikament).join('');
  const reev = renderReeval(algo.reevaluation);
  const bilder = (algo.bilder && algo.bilder.length === 0)
    ? `<div class="bilder-section">📷 Bilder folgen später</div>`
    : '';
  return `<div class="card-body">
    <div class="monitoring-strip"><span>MONITORING</span></div>
    ${blocks.join('')}
    ${meds}
    ${reev}
    ${bilder}
  </div>`;
}

function renderCard(algo) {
  const open = state.open.has(algo.id);
  return `<div class="card ${open ? 'open' : ''}" data-id="${algo.id}">
    <div class="card-header">
      <div class="title">${escapeHtml(algo.title)}</div>
      <span class="chevron">${iconSvg('chevron')}</span>
    </div>
    ${renderCardBody(algo)}
  </div>`;
}

function renderList() {
  const filtered = ALGORITHMS.filter(matchesFilter);
  $('#cardList').innerHTML = filtered.map(renderCard).join('');
  $('#emptyState').style.display = filtered.length ? 'none' : 'block';
}

function render() {
  renderFilters();
  renderList();
}

// ===== Events =====
document.addEventListener('click', e => {
  // Filter chip
  const chip = e.target.closest('.filter-chip[data-cat]');
  if (chip) {
    const cat = chip.dataset.cat;
    if (state.filters.has(cat)) state.filters.delete(cat);
    else state.filters.add(cat);
    render();
    return;
  }
  // Filter reset
  if (e.target.closest('#filterReset')) {
    state.filters.clear();
    render();
    return;
  }
  // Card toggle
  const cardHeader = e.target.closest('.card-header');
  if (cardHeader) {
    const id = cardHeader.parentElement.dataset.id;
    if (state.open.has(id)) state.open.delete(id);
    else state.open.add(id);
    cardHeader.parentElement.classList.toggle('open');
    return;
  }
});

$('#search').addEventListener('input', e => {
  state.search = e.target.value.trim();
  renderList();
});

render();
</script>
</body>
</html>
